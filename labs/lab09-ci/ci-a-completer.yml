# Pipeline CI à compléter — copiez ce fichier dans .github/workflows/ci.yml
# Les critères d'acceptation sont dans labs/lab09-ci/test_workflow.py.
name: CI

on:
  push:
    branches: [main]
  # TODO 1 : lancer aussi le pipeline sur chaque pull request

jobs:
  python:
    runs-on: ubuntu-latest
    # TODO 2 : matrice sur 2 versions de Python (ex. 3.11 et 3.13)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # TODO 3 : activer le cache pip
      - run: pip install -r requirements-dev.txt
